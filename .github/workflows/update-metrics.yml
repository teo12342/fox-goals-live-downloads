name: Refresh public CurseForge downloads
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: fox-goals-public-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch authoritative author metrics
        run: node scripts/update-metrics.mjs
      - name: Update published JSON
        run: |
          git config user.name "fox-goals-metrics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public CurseForge counts"
            git push
          fi
